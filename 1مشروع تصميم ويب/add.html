<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>أضف منتج</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <!-- CSS مخصص -->
  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    body { background-color: #f4f7f9; }
    .product-card img { height: 120px; object-fit: cover; border-radius: 5px; }
    .product-card { border: 1px solid #ddd; border-radius: 5px; padding: 10px; text-align: center; background: #fff; margin-bottom: 15px; }
    .input-icon { position: relative; }
    .input-icon i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #aaa; font-size: 1rem; }
    .input-icon input, .input-icon textarea { padding-left: 35px; }
    .btn i { margin-left: 5px; }
  </style>

  <!-- jQuery & Bootstrap JS -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="index.html">موقعي</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
      aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="index.html">🏠 الرئيسية</a></li>
        <li class="nav-item"><a class="nav-link" href="products.html">📦 المنتجات</a></li>
        <li class="nav-item"><a class="nav-link active" href="add.html">➕ إضافة منتج</a></li>
        <li class="nav-item"><a class="nav-link" href="contact.html">📞 تواصل معنا</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Container -->
<div class="container py-4">

  <h2 class="text-center mb-4">إضافة منتج جديد</h2>

  <!-- نموذج إضافة منتج -->
  <form id="addProductForm" novalidate class="mb-5">
    <div class="mb-3 input-icon">
      <i class="fas fa-tag"></i>
      <input type="text" class="form-control" id="productName" placeholder="اسم المنتج" required>
      <div class="invalid-feedback">الرجاء إدخال اسم المنتج.</div>
    </div>

    <div class="mb-3 input-icon">
      <i class="fas fa-align-left"></i>
      <textarea class="form-control" id="productDesc" rows="3" placeholder="وصف المنتج"></textarea>
    </div>

    <div class="mb-3 input-icon">
      <i class="fas fa-dollar-sign"></i>
      <input type="number" class="form-control" id="productPrice" placeholder="السعر" required>
      <div class="invalid-feedback">الرجاء إدخال السعر.</div>
    </div>

    <div class="mb-3 input-icon">
      <i class="fas fa-image"></i>
      <input type="file" class="form-control" id="productImage" accept="image/*">
    </div>

    <div class="d-grid">
      <button type="submit" class="btn btn-success">➕ إضافة المنتج <i class="fas fa-plus"></i></button>
    </div>
  </form>

  <hr>

  <h3 class="mb-3">المنتجات الحالية</h3>
  <div class="row" id="productsGrid">
    <!-- المنتجات المضافة سابقًا -->
    <div class="col-md-3 col-sm-4 product-card">
      <img src="assets/images/product1.jpg" alt="منتج 1">
      <p>منتج 1</p>
    </div>
    <div class="col-md-3 col-sm-4 product-card">
      <img src="assets/images/product2.jpg" alt="منتج 2">
      <p>منتج 2</p>
    </div>
    <div class="col-md-3 col-sm-4 product-card">
      <img src="assets/images/product3.jpg" alt="منتج 3">
      <p>منتج 3</p>
    </div>
  </div>

</div>

<script>
  // إضافة المنتجات الجديدة
  $('#addProductForm').on('submit', function(e) {
    e.preventDefault();
    var form = this;
    if(form.checkValidity() === false) {
      form.classList.add('was-validated');
      return;
    }

    var name = $('#productName').val();
    var desc = $('#productDesc').val();
    var price = $('#productPrice').val();
    var fileInput = $('#productImage')[0];
    var imgSrc = '';

    if(fileInput.files && fileInput.files[0]) {
      var reader = new FileReader();
      reader.onload = function(e) {
        imgSrc = e.target.result;
        addProductCard(name, imgSrc);
      };
      reader.readAsDataURL(fileInput.files[0]);
    } else {
      imgSrc = 'assets/images/default.png'; // صورة افتراضية
      addProductCard(name, imgSrc);
    }

    form.reset();
    form.classList.remove('was-validated');
  });

  function addProductCard(name, imgSrc) {
    $('#productsGrid').append(`
      <div class="col-md-3 col-sm-4 product-card">
        <img src="${imgSrc}" alt="${name}">
        <p>${name}</p>
      </div>
    `);
  }
</script>

</body>
</html>
