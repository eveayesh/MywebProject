<div class="container">
  <h2 class="text-center mb-3">تواصل معنا</h2>
  <div class="row g-3">
    <div class="col-md-6">
      <div class="p-3 bg-white rounded-3 shadow-sm">
        <h5><i class="fa-solid fa-envelope"></i> البريد الإلكتروني</h5>
        <p>ElAFSTORE@gmail.com</p>
        <h5><i class="fa-solid fa-phone"></i> الهاتف</h5>
        <p>+967 777755555</p>
      </div>
    </div>
    <div class="col-md-6">
      <form id="contactForm" class="p-3 bg-white rounded-3 shadow-sm">
        <div class="mb-2">
          <label class="form-label">الاسم</label>
          <input class="form-control" name="name" required>
        </div>
        <div class="mb-2">
          <label class="form-label">البريد</label>
          <input class="form-control" name="email" type="email" required>
        </div>
        <div class="mb-2">
          <label class="form-label">الرسالة</label>
          <textarea class="form-control" name="message" rows="4" required></textarea>
        </div>
        <button type="submit" class="btn btn-primary" onclick="showToast('تم ارسال الرسالة','success');">ارسال</button>
      </form>
    </div>
  </div>
