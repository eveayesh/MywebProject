<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>ايلاف ستور - الرئيسية</title>

  <!-- Bootstrap & FontAwesome -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

  <!-- CSS مخصص -->
  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    header { background: linear-gradient(90deg, #4e73df, #224abe); color: white; padding: 50px 0; text-align: center; font-size: 2.5rem; font-weight: bold; }
    nav.nav-links { background: #ffffff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    nav.nav-links ul { display: flex; justify-content: center; gap: 25px; padding: 15px 0; margin: 0; list-style: none; }
    nav.nav-links ul li a { text-decoration: none; color: #555; font-weight: 500; display: flex; align-items: center; gap: 6px; transition: 0.3s; }
    nav.nav-links ul li a:hover { color: #224abe; font-weight: bold; }
    .carousel-inner img { border-radius: 10px; max-height: 400px; object-fit: cover; }
    .section-title { margin-top: 50px; margin-bottom: 30px; font-size: 2rem; font-weight: bold; color: #224abe; text-align: center; }
    .product-card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-align: center; }
    .product-card img { max-height: 200px; border-radius: 8px; object-fit: cover; margin-bottom: 10px; }
    .product-card h5 { font-weight: bold; color: #224abe; }
    .video-section { margin-top: 50px; text-align: center; }
    .cta-btn { margin-top: 20px; font-size: 1.2rem; padding: 12px 25px; }
    footer { background: #224abe; color: #fff; padding: 20px 0; margin-top: 50px; text-align: center; font-weight: 500; }
  </style>
</head>
<body>

  <!-- Header -->
  <header>
    أهلاً بك في موقع ايلاف ستور
  </header>

  <!-- Navbar with icons -->
  <nav class="nav-links">
    <ul>
      <li><a href="index.html"><i class="fas fa-home"></i> الرئيسية</a></li>
      <li><a href="products.html"><i class="fas fa-box"></i> المنتجات</a></li>
      <li><a href="add.html"><i class="fas fa-plus-circle"></i> إضافة منتج</a></li>
      <li><a href="contact.html"><i class="fas fa-phone"></i> تواصل معنا</a></li>
      <li><a href="login.html"><i class="fas fa-user"></i> تسجيل الدخول</a></li>
      <li><a href="usage.html"><i class="fas fa-question-circle"></i> طريقة الاستخدام</a></li>
    </ul>
  </nav>

  <!-- Carousel -->
  <div id="carouselExample" class="carousel slide mt-4 container" data-bs-ride="carousel">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="assets/images/product1.jpg" class="d-block w-100" alt="صورة 1">
      </div>
      <div class="carousel-item">
        <img src="assets/images/product2.jpg" class="d-block w-100" alt="صورة 2">
      </div>
      <div class="carousel-item">
        <img src="assets/images/product3.jpg" class="d-block w-100" alt="صورة 3">
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>

  <!-- Modal -->
  <div class="text-center mt-4">
    <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#myModal">
      فتح نافذة AJAX
    </button>
  </div>

  <div class="modal fade" id="myModal">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title">نافذة AJAX</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="modalContent">جارٍ التحميل...</div>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <footer>
    جميع الحقوق محفوظة © 2025
  </footer>

  <!-- JS -->
  <script src="assets/js/main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    $('#myModal').on('show.bs.modal', function () {
      $("#modalContent").load("usage.html"); // Ajax load
    });
  </script>

</body>
</html>
